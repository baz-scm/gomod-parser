repos:
  - repo: local
    hooks:
      - id: fmt
        name: fmt
        language: system
        types: [ rust ]
        entry: cargo fmt --all
        pass_filenames: false
      - id: clippy
        name: clippy
        language: system
        types: [ rust ]
        entry: cargo clippy --workspace -- -D warnings
        pass_filenames: false
      - id: check_test
        name: check test
        language: system
        types: [ rust ]
        entry: cargo check --tests --workspace
        pass_filenames: false
